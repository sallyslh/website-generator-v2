<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Website Sketches</title>
<style>
  :root {
    --bg: #fbf7f1; --card: #ffffff; --ink: #231f1a; --muted: #6f675d; --line: #e6dfd3;
    --accent: #2c6e5b; --accent-dark: #1f5144; --accent-soft: #e3f0ea; --warm: #f0a35e; --warm-soft: #fdf0e2;
    --bad: #b3261e; --bad-soft: #fbe9e7; --radius: 16px;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1100px 500px at 85% -10%, #f6e6d0 0%, transparent 60%), var(--bg); color: var(--ink); font: 18px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
  header.top { max-width: 920px; margin: 0 auto; padding: 22px 20px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-family: var(--serif); font-size: 1.25rem; font-weight: 700; letter-spacing: .2px; }
  .brand span { color: var(--accent); }
  main { max-width: 920px; margin: 0 auto; padding: 18px 20px 60px; }
  h1 { font-family: var(--serif); font-size: clamp(1.9rem, 5vw, 2.8rem); line-height: 1.15; margin: 10px 0 10px; }
  h2 { font-family: var(--serif); font-size: clamp(1.4rem, 3.5vw, 1.8rem); margin: 0 0 6px; }
  p.lead { color: var(--muted); font-size: 1.08rem; margin: 0 0 22px; max-width: 640px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(18px, 4vw, 32px); box-shadow: 0 12px 34px rgba(60, 40, 10, .07); }
  .stepnav { display: flex; gap: 8px; margin: 0 0 18px; }
  .stepnav button { flex: 1; min-width: 0; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font: inherit; color: var(--muted, #6b6b6b); }
  .stepnav button i { display: block; height: 7px; border-radius: 99px; background: var(--line); margin-bottom: 6px; }
  .stepnav button.done i { background: var(--accent); } .stepnav button.now i { background: var(--warm); }
  .stepnav button span { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stepnav button.now span { color: inherit; font-weight: 700; } .stepnav button:hover span { text-decoration: underline; }
  @media (max-width: 560px) { .stepnav button span { display: none; } }
  .steps { display: flex; gap: 8px; margin: 0 0 18px; }
  .steps i { flex: 1; height: 7px; border-radius: 99px; background: var(--line); }
  .steps i.done { background: var(--accent); } .steps i.now { background: var(--warm); }
  .stepname { color: var(--muted); font-size: .92rem; margin-bottom: 4px; letter-spacing: .3px; text-transform: uppercase; font-weight: 600; }
  label.f { display: block; margin: 18px 0 6px; font-weight: 600; }
  .hint { color: var(--muted); font-weight: 400; font-size: .92rem; display: block; margin-top: 2px; }
  input[type=text], input[type=url], input[type=tel], input[type=email], textarea { width: 100%; font: inherit; padding: 13px 15px; border: 1.5px solid var(--line); border-radius: 12px; background: #fffdfa; color: var(--ink); }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible, .tile:focus-within, .drop:focus-within { outline: 3px solid #f5c892; outline-offset: 1px; border-color: var(--warm); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; } @media (max-width: 640px) { .two { grid-template-columns: 1fr; } }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 8px; }
  .tile { border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; background: #fffdfa; display: flex; gap: 10px; align-items: flex-start; }
  .tile.on { border-color: var(--accent); background: var(--accent-soft); }
  .tile input { margin-top: 5px; accent-color: var(--accent); width: 18px; height: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 24px; }
  button { font: inherit; cursor: pointer; border-radius: 99px; padding: 13px 26px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); font-weight: 600; }
  button.go { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 8px 18px rgba(44, 110, 91, .25); }
  button.go:hover { background: var(--accent-dark); } button.warm { background: var(--warm); border-color: var(--warm); color: #3a2200; }
  button.quiet { border-color: transparent; background: transparent; color: var(--muted); text-decoration: underline; padding-left: 8px; padding-right: 8px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .note { border-radius: 14px; padding: 14px 16px; margin-top: 16px; }
  .note.warm { background: var(--warm-soft); border: 1px solid #f3d3ad; } .note.bad { background: var(--bad-soft); border: 1px solid #f1c5c0; color: #6b1a14; }
  .note.good { background: var(--accent-soft); border: 1px solid #c3ddd2; }
  .drop { border: 2px dashed #d8cdb9; border-radius: 16px; padding: 20px; text-align: center; background: #fffdfa; cursor: pointer; position: relative; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .drop .folderbtn { position: relative; z-index: 2; display: block; margin: 12px auto 0; }
  .drop b { display: block; font-size: 1.05rem; }
  .tile.kind { background: #fffdfa; border: 2px solid #e6dcc9; border-radius: 14px; padding: 14px; font: inherit; color: inherit; }
  .tile.kind:hover { border-color: var(--accent); }
  .tablewrap { overflow-x: auto; border: 1px solid #e6dcc9; border-radius: 12px; margin-top: 10px; }
  table.items { width: 100%; border-collapse: collapse; min-width: 520px; }
  table.items th { text-align: left; font-size: .8rem; color: var(--muted); padding: 8px 10px; background: #faf6ee; }
  table.items td { padding: 4px 6px; border-top: 1px solid #efe7d8; }
  input.cell { width: 100%; border: 1px solid transparent; background: transparent; padding: 7px 8px; border-radius: 8px; font: inherit; }
  input.cell:hover, input.cell:focus { border-color: #d8cdb9; background: #fff; }
  .counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
  .count { background: #faf6ee; border-radius: 10px; padding: 8px 10px; } .count b { display: block; font-size: 1.4rem; } .count span { font-size: .8rem; color: var(--muted); }
  .matchrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; border-top: 1px solid #efe7d8; padding: 10px 0; }
  .matchrow .files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .thumbfile { display: inline-flex; align-items: center; gap: 4px; background: #faf6ee; border-radius: 8px; padding: 2px 8px; font-size: .8rem; overflow-wrap: anywhere; }
  .thumbfile .quiet { padding: 0 6px; }
  .itemright { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .chip { font-size: .72rem; font-weight: 700; border-radius: 999px; padding: 2px 10px; background: #efe7d8; color: var(--muted); white-space: nowrap; }
  .chip.good { background: #e1f2e8; color: #1f7a4d; } .chip.warm { background: #fff0d4; color: #9a5b00; } .chip.bad { background: #fbe5de; color: #a8402a; }
  details.itemsum { margin: 8px 0; } details.itemsum summary { cursor: pointer; font-weight: 600; }
  @media (max-width: 640px) { .matchrow { grid-template-columns: 1fr; } } .drop small { color: var(--muted); }
  details.byhand { margin: 14px 0; } details.byhand > summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 10px; }
  .tab { background: #fff; border: 1px solid var(--line, #e6dcc9); border-radius: 99px; padding: 8px 14px; cursor: pointer; font: inherit; }
  .tab.on { background: var(--accent, #2d6e5c); color: #fff; border-color: transparent; }
  td.ph { width: 140px; vertical-align: top; }
  .rowthumb { position: relative; display: inline-block; margin: 0 6px 6px 0; }
  .rowthumb img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; display: block; }
  .rowthumb button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; padding: 0; line-height: 16px; border-radius: 50%; background: rgba(0,0,0,.7); color: #fff; border: 0; cursor: pointer; font-size: 12px; }
  .addphoto { padding: 4px 8px; font-size: 13px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; justify-content: center; }
  .thumb { position: relative; width: 92px; height: 92px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #f4efe6; display: grid; place-items: center; font-size: .75rem; padding: 4px; text-align: center; word-break: break-all; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .thumb button { position: absolute; top: 3px; right: 3px; z-index: 2; padding: 0; width: 26px; height: 26px; line-height: 22px; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; border: 0; font-size: 1rem; }
  dl.review { margin: 0; } dl.review div { display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; padding: 9px 0; border-bottom: 1px solid var(--line); } dl.review dt { color: var(--muted); } dl.review dd { margin: 0; word-break: break-word; }
  @media (max-width: 640px) { dl.review div { grid-template-columns: 1fr; } }
  .progress { list-style: none; padding: 0; margin: 20px 0; }
  .progress li { display: flex; gap: 14px; align-items: center; padding: 12px 0; color: var(--muted); border-bottom: 1px solid var(--line); }
  .progress li.working { color: var(--ink); font-weight: 600; } .progress li.done { color: var(--accent); }
  .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: .9rem; }
  li.done .dot { background: var(--accent); border-color: var(--accent); color: #fff; }
  li.working .dot { border-color: var(--warm); border-top-color: transparent; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .found { border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 12px; }
  .found h3 { margin: 0 0 6px; font-size: 1.02rem; } .found ul { margin: 4px 0 8px 18px; padding: 0; }
  .swatches { display: flex; gap: 8px; margin: 6px 0 10px; } .swatch { width: 42px; height: 42px; border-radius: 10px; border: 1px solid rgba(0,0,0,.15); }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 99px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 8px 18px; background: #fff; font-weight: 600; } .seg button.yes.on { background: var(--accent); color: #fff; } .seg button.no.on { background: var(--bad); color: #fff; }
  .sketches.single { grid-template-columns: 1fr; max-width: 860px; margin-left: auto; margin-right: auto; }
  .pagetabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: #fbf8f2; }
  .pagetabs .tab { padding: 6px 16px; font-size: .92rem; }
  .pagetabs .tab.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
  .sketches { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 18px; } @media (max-width: 860px) { .sketches { grid-template-columns: 1fr; } }
  .sketch { background: #fff; border: 2px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
  .sketch.picked { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .chrome { background: #efe8dc; padding: 9px 12px; display: flex; gap: 6px; } .chrome i { width: 10px; height: 10px; border-radius: 50%; background: #d0c5b1; }
  .view { position: relative; overflow: hidden; background: #fff; } .view iframe { border: 0; width: 1440px; height: 1900px; transform-origin: top left; pointer-events: none; }
  .sketch .body { padding: 16px 18px 20px; } .sketch h3 { font-family: var(--serif); margin: 0 0 4px; font-size: 1.3rem; } .sketch p { margin: 0 0 14px; color: var(--muted); font-size: .98rem; }
  .busy { position: fixed; inset: 0; background: rgba(251, 247, 241, .93); display: grid; place-items: center; z-index: 10; text-align: center; padding: 20px; }
  .busy .bar { height: 10px; width: min(380px, 80vw); background: var(--line); border-radius: 99px; overflow: hidden; margin: 14px auto 0; } .busy .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .check { font-size: 3rem; } .center { text-align: center; }
  footer { max-width: 920px; margin: 0 auto; padding: 0 20px 40px; color: var(--muted); font-size: .9rem; }
  .req { color: var(--bad); }
  .mine { margin: 0 0 26px; } .mine h2 { margin-bottom: 10px; }
  .mine .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .proj { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .proj .pic { width: 56px; height: 56px; border-radius: 12px; background: var(--accent-soft); flex: none; display: grid; place-items: center; font-weight: 700; color: var(--accent-dark); font-size: 1.4rem; overflow: hidden; }
  .proj .pic img { width: 100%; height: 100%; object-fit: cover; }
  .proj .info { flex: 1; min-width: 0; } .proj b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj small { color: var(--muted); display: block; } .proj .st { font-weight: 600; color: var(--accent-dark); }
  .proj button { padding: 8px 16px; }
</style>
</head>
<body>
<header class="top"><div class="brand" id="brand" role="link" tabindex="0" title="Back to the start" style="cursor:pointer">Your <span>Website</span> Sketches</div><div id="topright" class="hint"></div></header>
<main id="app"></main>
<footer>Your information is only used to prepare your website sketches.</footer>

<script src="/match.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function h(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (k.includes('-')) { if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v); } // aria-label, data-x: real attributes
    else if (v !== undefined && v !== null && v !== false) node[k] = v;
  }
  for (const c of [].concat(children)) if (c !== null && c !== undefined && c !== false) node.append(c);
  return node;
}

// ---------- previous projects (remembered on this device) ----------
const STATUS_TEXT = { queued: 'Being prepared', analyzing: 'Being prepared', designing: 'Being drawn', confirm: 'Waiting for your check', ready: 'Sketches ready', building: 'Finishing your choice', chosen: 'Approved', failed: 'Needs another try' };
function savedIds() {
  try {
    const v = JSON.parse(localStorage.getItem('sketchRequestIds') || '[]');
    const list = Array.isArray(v) ? v.filter((x) => typeof x === 'string') : [];
    const old = localStorage.getItem('sketchRequestId'); // a request made before this list existed
    return old && !list.includes(old) ? [...list, old] : list;
  } catch { return []; }
}
function rememberId(id) { try { localStorage.setItem('sketchRequestIds', JSON.stringify([id, ...savedIds().filter((x) => x !== id)].slice(0, 30))); } catch { /* storage not available */ } }
async function loadMine() {
  const ids = savedIds();
  if (!ids.length) { S.mine = []; return; }
  try { S.mine = await post('/api/mine', { ids }); } catch { S.mine = []; }
  if (S.view === 'form' && S.step === 0) render();
}
function openProject(id) {
  S.id = id; S.status = null; S.picked = 0; S.lastAlt = undefined; S.note = '';
  history.replaceState(null, '', `?id=${id}`);
  try { localStorage.setItem('sketchRequestId', id); } catch { /* storage not available */ }
  boot();
}
function viewMine() {
  if (!S.mine?.length) return [];
  const when = (iso) => (iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '');
  return [h('section', { class: 'mine', id: 'mine' }, [
    h('h2', { textContent: 'Your previous projects' }),
    h('div', { class: 'list' }, S.mine.map((p) => h('div', { class: 'proj' }, [
      h('div', { class: 'pic' }, p.picture ? h('img', { src: p.picture, alt: '' }) : (p.name || '?').trim().charAt(0).toUpperCase()),
      h('div', { class: 'info' }, [h('b', { textContent: p.name || 'Untitled project' }), h('small', { class: 'st', textContent: STATUS_TEXT[p.phase] ?? p.phase }), h('small', { textContent: when(p.createdAt) })]),
      h('button', { class: 'go', textContent: 'Open', onclick: () => openProject(p.id) }),
    ]))),
  ])];
}

// The words of the form depend on the kind of website: a restaurant has dishes and a menu, a shop has products, a service business has
// services. Every question, button and message takes its nouns from here, so a salon is never asked for "your menu".
const VOCAB = {
  menu: { item: 'dish', items: 'dishes', yourList: 'menu', stepName: 'Your menu', pageName: 'Menu', priceDoc: 'menu', place: 'place', ownerQuestion: 'What is your restaurant or cafe called?', kindQuestion: 'What kind of place is it?', kindExample: 'Lebanese home cooking, dine in and delivery.', sections: 'Sub-folders (Starters, Mains) become menu sections', exampleFile: 'Fattoush', askItems: 'What are your main dishes?', itemsPlaceholder: 'Fattoush - $8\nKibbeh - $12', photosTitle: 'Photos of your dishes and your place' },
  shop: { item: 'product', items: 'products', yourList: 'product list', stepName: 'Your products', pageName: 'Shop', priceDoc: 'price list', place: 'shop', ownerQuestion: 'What is your shop called?', kindQuestion: 'What do you sell?', kindExample: 'Original perfumes for men and women, ordered by message.', sections: 'Sub-folders (Women, Men) become categories', exampleFile: 'Gucci Bloom', askItems: 'What are your main products?', itemsPlaceholder: 'Eau de parfum for men - $60\nEau de parfum for women - $55', photosTitle: 'Photos of your products and your place' },
  services: { item: 'service', items: 'services', yourList: 'list of services', stepName: 'Your services', pageName: 'Services', priceDoc: 'price list', place: 'business', ownerQuestion: 'What is your business called?', kindQuestion: 'What do you do?', kindExample: 'A hair salon for colour and styling.', sections: 'Sub-folders (Hair, Nails) become categories', exampleFile: 'Haircut', askItems: 'What services do you offer?', itemsPlaceholder: 'Haircut - $25\nManicure - $30', photosTitle: 'Photos of your place or your work' },
  intro: { item: 'project', items: 'projects', yourList: 'list of your work', stepName: 'Your work', pageName: 'Our work', priceDoc: 'brochure', place: 'business', ownerQuestion: 'What is your business called?', kindQuestion: 'What do you do?', kindExample: 'We are a small law firm for families.', sections: 'Sub-folders (Branding, Interiors) become groups', exampleFile: 'Villa Rosa', askItems: 'What work or offers would you like to show? (optional)', itemsPlaceholder: 'Villa Rosa\nBrand identity for Cafe Noor', photosTitle: 'Photos of your place or your work' },
  other: { item: 'item', items: 'items', yourList: 'list', stepName: 'Your list', pageName: 'Products', priceDoc: 'price list', place: 'business', ownerQuestion: 'What is your business called?', kindQuestion: 'What do you do?', kindExample: 'One sentence is perfect.', sections: 'Sub-folders become categories', exampleFile: 'Name', askItems: 'What do you offer?', itemsPlaceholder: '', photosTitle: 'Photos of your place, products or work' },
};
const V = () => VOCAB[S.formKind] ?? VOCAB.other;
const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
const num = (n, one, many) => `${n} ${n === 1 ? one : many}`;
// the kinds that have their own list-and-pictures form (the others use the general form)
const LISTED_KINDS = ['menu', 'shop', 'services'];
const namesFromPictures = () => ['menu', 'services'].includes(S.formKind); // the list can start from the picture names
const stepNames = () => ['Your business', 'How people reach you', V().stepName, 'Look and feel', 'Check and send'];
// the same for the questions about what the business does and how its pictures are used
const LOOK = {
  menu: { doQ: 'What kind of place is it?', doEx: 'Lebanese home cooking, dine in and delivery.', wishes: 'my signature dish first, a seasonal special, a warm cozy feeling, a picture of the dining room', own: 'your own dishes', never: 'Your dishes themselves' },
  shop: { doQ: 'What do you sell?', doEx: 'We sell perfumes online...', wishes: 'my best sellers first, a seasonal offer, a warm cozy feeling, a picture of my products together', own: 'your own products', never: 'Your products themselves' },
  services: { doQ: 'What do you do?', doEx: 'We are a hair salon in Beirut...', wishes: 'my most booked service first, a seasonal offer, a calm feeling, a picture of my team at work', own: 'your own place and work', never: 'Your place and your work themselves' },
  intro: { doQ: 'What do you do?', doEx: 'We are a small law firm for families...', wishes: 'what I want people to feel first, a seasonal message, a warm cozy feeling', own: 'your own place and work', never: 'Your place and your work themselves' },
  other: { doQ: 'What do you do?', doEx: 'One or two sentences...', wishes: 'what I want people to feel first, a warm cozy feeling', own: 'your own place and work', never: 'Your place and your work themselves' },
};
const L = () => LOOK[S.formKind] ?? LOOK.other;
const showsPrices = () => S.formKind !== 'intro'; // a website that only presents the business has no prices
const GOALS = {
  orders: ['Get orders by message or DM', 'Customers choose and message me to order.'],
  bookings: ['Get bookings or appointments', 'Customers book a time with me.'],
  showcase: ['Show my products and prices', 'A clear catalog people can browse.'],
  calls: ['Get phone calls and visits', 'Customers call me or come to my place.'],
  trust: ['Introduce my business', 'Build trust and tell my story.'],
  other: ['Something else', 'I will describe it.'],
};
const PAGES = { products: 'Products or menu', about: 'About us', gallery: 'Gallery', contact: 'Contact' };

async function api(path, options = {}) {
  const res = await fetch(path, { method: options.method || 'GET', headers: options.headers || { 'Content-Type': 'application/json' }, body: options.body });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
  return data;
}

const LIMITS = { photo: 5 * 1024 * 1024, logo: 5 * 1024 * 1024, document: 20 * 1024 * 1024 };
const EXT = { photo: /\.(jpe?g|png|webp)$/i, logo: /\.(jpe?g|png|webp|svg)$/i, document: /\.(pdf|jpe?g|png|webp)$/i };

// ---------- a whole folder of pictures at once ----------
const MAX_PHOTOS = 150;
const naturalSort = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }); // photo2 before photo10

// A big camera photo (often 6 to 12 MB) is made smaller here instead of being refused. Returns null when it cannot be used.
async function shrinkIfNeeded(file, limit) {
  if (file.size <= limit) return file;
  try {
    const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const scale = Math.min(1, 2400 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(bitmap.width * scale)); canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
    return blob && blob.size <= limit ? new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : null;
  } catch { return null; }
}

// Every file inside what was dropped, folders and their subfolders included.
async function filesFromDrop(dataTransfer) {
  const out = [];
  const walk = async (entry, prefix) => {
    if (entry.isFile) await new Promise((resolve) => entry.file((f) => { try { Object.defineProperty(f, 'folderPath', { value: prefix + f.name }); } catch { /* read only */ } out.push(f); resolve(); }, resolve));
    else if (entry.isDirectory) {
      const reader = entry.createReader();
      for (;;) {
        const batch = await new Promise((resolve) => reader.readEntries(resolve, () => resolve([])));
        if (!batch.length) break;
        for (const e of batch) await walk(e, prefix + entry.name + '/');
      }
    }
  };
  const entries = [...(dataTransfer.items ?? [])].map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
  if (!entries.length) return [...dataTransfer.files];
  for (const e of entries) await walk(e, '');
  return out;
}

// Pictures chosen one by one, dropped, or taken from a folder. Pictures only (others are skipped and counted), natural order, a file
// called logo... becomes the logo when there is none yet, big photos are shrunk, and what does not fit in 20 is said plainly.
async function addPhotos(list) {
  S.fileMessage = ''; S.moveOffer = null;
  const pathOf = (f) => f.webkitRelativePath || f.folderPath || f.name;
  const files = [...list].sort((a, b) => naturalSort(pathOf(a), pathOf(b)));
  const folder = files.map(pathOf).find((p) => p.includes('/'))?.split('/')[0];
  let added = 0; let skipped = 0; let unreadable = 0; let over = 0; let logo = false; let duplicates = 0;
  for (const f of files) {
    if (!EXT.photo.test(f.name)) { skipped++; continue; }
    if (S.files.photos.some((p) => p.srcKey === photoKey(f))) { duplicates++; continue; } // the same photo (name and size) is already here
    if (!S.files.logo && /^logo/i.test(f.name)) { const small = await shrinkIfNeeded(f, LIMITS.logo); if (small) { S.files.logo = small; logo = true; continue; } }
    if (S.files.photos.length >= MAX_PHOTOS) { over++; continue; }
    const small = await shrinkIfNeeded(f, LIMITS.photo);
    if (!small) { unreadable++; continue; }
    small.itemPath = pathOf(f); small.srcKey = photoKey(f); S.files.photos.push(small); added++;
  }
  const parts = [];
  if (added) parts.push(`Added ${added} picture${added === 1 ? '' : 's'}${folder ? ` from "${folder}"` : ''}.`);
  if (duplicates) parts.push(`${duplicates} photo${duplicates === 1 ? ' was' : 's were'} already added, so ${duplicates === 1 ? 'it was' : 'they were'} not added again.`);
  if (logo) parts.push('A file called "logo" was used as your logo.');
  if (over) parts.push(`${over} more picture${over === 1 ? ' was' : 's were'} not added: you can use up to ${MAX_PHOTOS} photos. Remove some and add others if you prefer.`);
  if (skipped) parts.push(`${skipped} file${skipped === 1 ? ' was' : 's were'} skipped because only JPG, PNG and WebP pictures are used.`);
  if (unreadable) parts.push(`${unreadable} picture${unreadable === 1 ? ' could' : 's could'} not be used (too large or damaged).`);
  if (S.kind === 'shop' && namesFromPictures() && added && !S.items.some((i) => i.name.trim())) { const n = listFromPhotos(); if (n) parts.push(`We built your ${V().yourList} from the photo names: ${num(n, V().item, V().items)}. Check the names and add the prices in the table below. Photos that are not ${V().items} (your place, for example) can be removed there.`); }
  S.fileMessage = parts.join(' ');
  S.fileTone = over || skipped || unreadable ? 'warm' : 'good';
  render();
}
// A menu or price list: a PDF, or pictures of its pages (chosen one by one, a whole folder, or dropped). Pictures are read like a PDF:
// the prices are taken from them and the customer confirms them. Several pages are fine (up to 10 files).
const MAX_DOCUMENTS = 10;
async function addDocuments(list) {
  S.fileMessage = ''; S.moveOffer = null;
  const pathOf = (f) => f.webkitRelativePath || f.folderPath || f.name;
  const files = [...list].sort((a, b) => naturalSort(pathOf(a), pathOf(b)));
  const folder = files.map(pathOf).find((p) => p.includes('/'))?.split('/')[0];
  // More than a few pictures is a folder of photos, not the pages of a menu: nothing is added here, the customer chooses.
  const pictures = files.filter((f) => /\.(jpe?g|png|webp)$/i.test(f.name));
  if (pictures.length > MAX_DOCUMENTS) {
    S.moveOffer = pictures; S.fileTone = 'warm';
    S.fileMessage = `These ${pictures.length} pictures${folder ? ` (from "${folder}")` : ''} look like photos, not the pages of a ${V().priceDoc}. A ${V().priceDoc} is a PDF or up to ${MAX_DOCUMENTS} pictures of its pages.`;
    return render();
  }
  let added = 0; let skipped = 0; let unreadable = 0; let over = 0;
  for (const f of files) {
    if (!EXT.document.test(f.name)) { skipped++; continue; }
    if (S.files.documents.length >= MAX_DOCUMENTS) { over++; continue; }
    const ok = /\.pdf$/i.test(f.name) ? (f.size <= LIMITS.document ? f : null) : await shrinkIfNeeded(f, LIMITS.photo);
    if (!ok) { unreadable++; continue; }
    S.files.documents.push(ok); added++;
  }
  const parts = [];
  if (added) parts.push(`Added ${added} page${added === 1 ? '' : 's'} of your ${V().priceDoc}${folder ? ` from "${folder}"` : ''}.`);
  if (over) parts.push(`${over} more ${over === 1 ? 'file was' : 'files were'} not added: up to ${MAX_DOCUMENTS} files are used.`);
  if (skipped) parts.push(`${skipped} file${skipped === 1 ? ' was' : 's were'} skipped because only PDF, JPG, PNG and WebP files are used.`);
  if (unreadable) parts.push(`${unreadable} file${unreadable === 1 ? ' could' : 's could'} not be used (too large or damaged).`);
  S.fileMessage = parts.join(' ');
  S.fileTone = over || skipped || unreadable ? 'warm' : 'good';
  render();
}
function dropzone(kind, title, hint, multiple) {

  const input = h('input', { type: 'file', multiple, accept: kind === 'document' ? '.pdf,application/pdf,image/*' : 'image/*', onchange: (e) => { take([...e.target.files]); } });

  if (kind === 'photo' || kind === 'document') { // a whole folder: the browser hands over every picture inside it, subfolders included

  ])));
  return h('div', { style: 'margin-top:18px' }, [zone, files.length ? thumbs : null]);
}

// The dish names come from the photo file names: "Starters/fattoush-2.jpg" is the dish "Fattoush" (one row for all its photos).
function dishName(path) {
  const base = String(path).split('/').pop().replace(/\.[a-z0-9]+$/i, '').replace(/[-_ ]+\(?\d+\)?$/, '').replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim();
  return base === base.toLowerCase() ? base.replace(/(^|\s)(\p{L})/gu, (m, a, b) => a + b.toUpperCase()) : base;
}
function listFromPhotos() {
  const have = new Set(S.items.map((i) => IM().norm(i.name)));
  const fresh = [];
  for (const f of S.files.photos) {
    const name = dishName(photoPath(f)); const key = IM().norm(name);
    if (!name || have.has(key)) continue;
    have.add(key); fresh.push({ name, price: '', description: '', fromPhoto: true }); // made from a photo name only: no price, no description
  }
  if (fresh.length) S.items = [...S.items.filter((i) => i.name.trim() || i.price || i.description), ...fresh];
  return fresh.length;
}
const IM = () => window.ItemMatch;
const photoPath = (f) => f.itemPath || f.webkitRelativePath || f.folderPath || f.name;
// the customer's own choices are remembered per photo (by its path), so removing a photo does not shift them
function shopAnalysis() {
  const ov = {};

  return IM().analyse(S.items.filter((i) => i.name.trim()), S.files.photos.map((f) => ({ path: photoPath(f) })), ov);
}

// ----- the product list -----
// Adds the rows of a list file to the table. A dish that is already there keeps what the owner wrote and only gets the parts it lacked.
// replacePhotoRows: the owner gave a real list, so dishes that were only made from photo names and are not in that list are removed
// (their photos stay as photos we could not place). The list is what the website shows, never a guess from a file name.
function addRows(rows, { replacePhotoRows = false } = {}) {
  let added = 0; let updated = 0; let dropped = 0;
  if (replacePhotoRows && rows.length) {
    const inList = new Set(rows.map((r) => IM().norm(r.name)));
    const before = S.items.length;
    S.items = S.items.filter((i) => !(i.fromPhoto && !i.price && !i.description && !inList.has(IM().norm(i.name))));
    dropped = before - S.items.length;
    if (dropped) { S.overrides = {}; S.noPhoto = {}; } // the positions changed: matches are made again from the names
  }
  for (const row of rows) {
    const key = IM().norm(row.name);
    const at = S.items.findIndex((i) => IM().norm(i.name) === key);
    if (at < 0) { S.items.push(row); added++; continue; }
    const it = S.items[at]; let changed = false;
    if (!it.price && row.price) { it.price = row.price; changed = true; }
    if (!it.description && row.description) { it.description = row.description; changed = true; }
    if (!it.category && row.category) { it.category = row.category; changed = true; }
    if (changed) { updated++; it.fromPhoto = false; }
  }
  S.items = S.items.filter((i) => i.name.trim() || i.price || i.description);
  return { added, updated, dropped };
}
// A file with the whole list. CSV/TSV/text are read here, exactly as written (columns found by their titles). PDFs and pictures go to
// the price-list reader and the owner checks every row. Excel and Word files are not read: the message says how to save them.
async function listFromFile(files) {
  S.fileMessage = ''; S.moveOffer = null;
  const text = files.filter((f) => /\.(csv|tsv|txt)$/i.test(f.name));
  const scans = files.filter((f) => /\.(pdf|jpe?g|png|webp)$/i.test(f.name));
  const office = files.filter((f) => /\.(xlsx?|docx?)$/i.test(f.name));
  let added = 0; let updated = 0; let dropped = 0;
  for (const f of text) {
    const r = addRows(IM().parseTable(await f.text(), /\.(csv|tsv)$/i.test(f.name)), { replacePhotoRows: true });
    added += r.added; updated += r.updated; dropped += r.dropped;
  }
  const parts = [];
  if (text.length) parts.push(added || updated ? `Read ${num(added, V().item, V().items)}${updated ? ` and completed ${updated}` : ''} from your file${dropped ? `. ${num(dropped, V().item, V().items)} made from picture names ${dropped === 1 ? 'is' : 'are'} not in your file, so ${dropped === 1 ? 'it was' : 'they were'} removed (the pictures stay: you can place them below)` : ''}. Please check the table below.` : `We found nothing to add in that file. It needs one ${V().item} per line or per row.`);
  if (office.length) parts.push('Excel and Word files cannot be read yet. In Excel use File, Save as, CSV. In Word, save it as PDF or a plain text file. Then upload it again.');
  S.fileTone = added || updated ? 'good' : 'warm';
  S.fileMessage = parts.join(' ');
  if (scans.length) { render(); return readListFromFiles(scans).then(() => { S.fileMessage = [S.fileMessage, S.listMessage].filter(Boolean).join(' '); S.fileTone = S.listTone === 'bad' ? 'bad' : 'warm'; render(); }); }
  render();
}

async function ensureDraft() { if (!S.draftId) S.draftId = (await post('/api/start')).id; return S.draftId; }
async function readListFromFiles(files) {
  S.listMessage = ''; S.listBusy = true; render();
  try {
    const id = await ensureDraft();
    const usable = [];
    for (const f of [...files].sort((a, b) => naturalSort(photoPath(a), photoPath(b)))) { if (!EXT.document.test(f.name)) continue; const small = /\.pdf$/i.test(f.name) ? f : await shrinkIfNeeded(f, LIMITS.photo); if (small) usable.push(small); }
    if (!usable.length) throw new Error(`Please choose a PDF or pictures (JPG, PNG, WebP) of your ${V().priceDoc}.`);
    for (const f of usable.slice(0, MAX_DOCUMENTS)) {
      const key = `${f.name}:${f.size}`;
      if (S.docsUploaded[key]) continue;
      await api(`/api/upload/${id}?kind=document&name=${encodeURIComponent(f.name)}`, { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream' }, body: f });
      S.docsUploaded[key] = true;
    }
    const { items } = await post(`/api/read-list/${id}`);
    const have = new Set(S.items.map((i) => i.name.trim().toLowerCase()));
    const fresh = items.filter((i) => !have.has(i.name.toLowerCase()));
    S.items = [...S.items.filter((i) => i.name.trim() || i.price || i.description), ...fresh];
    S.listMessage = fresh.length ? `We found ${num(fresh.length, V().item, V().items)} in your ${V().priceDoc}. Please check every row: names and prices must be exactly right.` : `We could not find any new ${V().items} in that ${V().priceDoc}.`;
    S.listTone = fresh.length ? 'warm' : 'bad';
  } catch (e) { S.listMessage = e.message; S.listTone = 'bad'; }
  S.listBusy = false; render();
}
// ----- ONE step for the products and their photos -----
// Whatever way things are added (a folder of photos, photos one by one, a list file, one product by hand), they all end up
// in the same table below. A photo that is already there (same name and size) is never added twice, and a product that is already
// there (same name, spelled any way) is completed instead of added again.
function photoKey(f) { return `${f.name.toLowerCase()}|${f.size}`; }
const thumbUrls = new WeakMap();
const thumbUrl = (file) => { if (!thumbUrls.has(file)) thumbUrls.set(file, URL.createObjectURL(file)); return thumbUrls.get(file); };
// the position among the NAMED products (the photo matching counts only those)
function namedIndexOf(i) { let k = 0; for (let j = 0; j < S.items.length; j++) { if (!S.items[j].name.trim()) continue; if (j === i) return k; k++; } return -1; }

// Removes a product. The photo choices that pointed to later products move up with them.
function dropItem(i) {
  const k = namedIndexOf(i);
  S.items.splice(i, 1);
  if (k < 0) return;
  for (const [key, v] of Object.entries(S.overrides)) { if (v === k) delete S.overrides[key]; else if (v > k) S.overrides[key] = v - 1; }
  const kept = {};
  for (const [idx, v] of Object.entries(S.noPhoto)) { const n = Number(idx); if (n !== k) kept[n > k ? n - 1 : n] = v; }
  S.noPhoto = kept;
}

// Photos chosen for ONE product (the "+ photo" of its row, or the "One at a time" form): linked to it directly.
async function attachPhotos(itemIndex, list) {
  const named = namedIndexOf(itemIndex);
  if (named < 0) return 0;
  let n = 0;
  for (const f of [...list]) {
    if (!EXT.photo.test(f.name)) continue;
    const key = photoKey(f);
    let photo = S.files.photos.find((p) => p.srcKey === key);
    if (!photo) {
      if (S.files.photos.length >= MAX_PHOTOS) break;
      const small = await shrinkIfNeeded(f, LIMITS.photo);
      if (!small) continue;
      small.itemPath = f.name; small.srcKey = key; S.files.photos.push(small); photo = small;
    }
    S.overrides[photoPath(photo)] = named; n++;
  }
  return n;
}

async function submitShop() {
  S.errors = [];
  try {
    setBusy('Sending your information...', 0);
    const id = await ensureDraft();
    const items = namedItems();
    const a = items.length ? shopAnalysis() : { photos: [], byItem: [] };
    const all = [...(S.files.logo ? [['logo', S.files.logo]] : []), ...S.files.photos.map((f) => ['photo', f]), ...(S.form.assistant === true ? S.files.knowledge.map((f) => ['knowledge', f]) : [])];

    for (const [i, [kind, file]] of all.entries()) {
      setBusy(`Uploading your photos (${i + 1} of ${all.length})...`, (i / (all.length + 1)) * 100);
      const r = await api(`/api/upload/${id}?kind=${kind}&name=${encodeURIComponent(file.name)}`, { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream' }, body: file });
      saved.set(file, r.saved);
    }
    setBusy('Almost there...', 95);
    const form = {
      ...S.form, siteType: 'shop', shopKind: S.formKind, hasLogo: Boolean(S.files.logo),
      items: items.map((it, i) => ({ name: it.name, price: it.price, description: it.description, category: a.byItem[i]?.[0]?.category || it.category || '' })),
      itemPhotos: a.photos.map((p) => ({ file: saved.get(S.files.photos[p.n]), item: p.item == null ? -1 : p.item })).filter((p) => p.file),
    };
    await post(`/api/submit/${id}`, { form });
    S.id = id; rememberId(id); S.draftId = null;
    try { localStorage.setItem('sketchRequestId', id); } catch { /* storage not available */ }
    history.replaceState(null, '', `?id=${id}`);
    setBusy(null);
    S.view = 'working';
    render(); watch();
  } catch (e) {
    setBusy(null);
    S.errors = [e.message];
    render();
  }
}

// A design shown in a browser-like frame, with one tab per page and a link to open the page full size.
function designCard({ title, desc, pages, extra }) {
  const view = h('div', { class: 'view' });
  const frame = h('iframe', { src: pages[0].url, title, loading: 'lazy', tabIndex: -1 });
  view.append(frame);
  const full = h('a', { href: pages[0].url, target: '_blank', rel: 'noopener', textContent: 'See this page full size', style: 'color:var(--accent);font-weight:600' });
  const fit = () => { const w = view.clientWidth || 400; const scale = w / 1440; frame.style.transform = `scale(${scale})`; view.style.height = `${1900 * scale}px`; };
  new ResizeObserver(fit).observe(view);
  setTimeout(fit, 0);
  const tabs = pages.length > 1 ? h('div', { class: 'pagetabs' }, pages.map((p, i) => h('button', {
    class: `tab ${i === 0 ? 'on' : ''}`, textContent: p.title,
    onclick: (e) => { frame.src = p.url; full.href = p.url; tabs.querySelectorAll('button').forEach((b) => b.classList.remove('on')); e.target.classList.add('on'); },
  }))) : null;
  const body = h('div', { class: 'body' }, [h('h3', { textContent: title }), h('p', { textContent: desc }), h('div', { class: 'row', style: 'margin-top:0' }, [full, ...(extra ?? [])])]);
  return h('div', { class: 'sketch' }, [h('div', { class: 'chrome' }, [h('i'), h('i'), h('i')]), tabs, view, body]);
}

    try { S.status.combined = (await post(`/api/combined/${S.id}`, { assetId, approve })).combined; render(); } catch (e) { alert(e.message); }
  };
  return h('div', { class: 'card', style: 'margin-top:18px' }, [
    h('h2', { textContent: 'Pictures we prepared for your pages' }),
    h('p', { class: 'lead', textContent: 'To make your pages richer we prepared a few pictures. Please tell us which ones you want on your website.' }),
    ...list.map((c) => h('div', { class: 'found' }, [
      h('img', { src: c.picture, alt: 'A picture prepared for your website', style: 'width:100%;max-width:560px;border-radius:12px;display:block;margin-bottom:10px' }),
      h('p', { class: 'hint', style: 'margin:0 0 10px', textContent: ({ collage: 'Several of your own photos side by side. Nothing was added or changed.', crop: 'One item cut out of your own photo. Nothing was added or changed.', composite: 'Your own items, cut out of your photos and placed together on a new background. The items themselves are not changed.', generated: c.photos > 0 ? 'A styled photo scene made with AI around your own items. Your items are exactly as in your photos; only the surroundings are new. It is only used if you choose it.' : 'A mood picture made with AI (a material or a quiet scene, never a product or text). It is only used if you choose it.' })[c.origin] ?? '' }),
      h('div', { class: 'seg' }, [
        h('button', { class: `yes ${c.approval === 'approved' ? 'on' : ''}`, textContent: 'Use this picture', onclick: () => decide(c.id, true) }),
        h('button', { class: `no ${c.approval === 'rejected' ? 'on' : ''}`, textContent: 'Do not use it', onclick: () => decide(c.id, false) }),
      ]),
      c.approval === 'rejected' ? h('div', { class: 'hint', textContent: 'That place on your website will wait for a photo from you instead.' }) : null,
    ])),
  ]);
}

// What the designer did with each wish the owner wrote for the home page.
function wishesPanel() {
  const list = S.status.wishes ?? [];
  if (!list.length) return null;
  const label = { used: 'Done', adapted: 'Adapted', declined: 'Not this time' };
  return h('div', { class: 'card', style: 'margin-top:18px' }, [
    h('h2', { textContent: 'What you asked for' }),
    ...list.map((w) => h('div', { class: 'found' }, [
      h('div', { style: 'font-weight:600', textContent: w.wish }),
      h('div', { class: 'hint', style: 'margin-top:4px' }, [h('b', { textContent: `${label[w.outcome] ?? w.outcome}: ` }), w.how]),
    ])),
  ]);
}

// Another version of any page: the customer asks, waits a couple of minutes, then picks the version they like.
function versionsPanel() {
  const st = S.status;
  const pages = st.pages ?? [];
  if (!pages.length) return null;
  const states = st.variants ?? {};
  const taken = Object.values(states).filter((v) => v === 'working' || v === 'ready').length;
  const ask = async (slug) => {
    try { await post(`/api/variant/${S.id}`, { slug }); S.status.variants = { ...states, [slug]: 'working' }; render(); watch(); } catch (e) { alert(e.message); }
  };
  const use = async (slug, screenId) => {
    try { S.status = await post(`/api/version/${S.id}`, { slug, screenId }); render(); } catch (e) { alert(e.message); }
  };
  const thumb = (label, picture, url, extra) => h('div', { style: 'flex:1 1 200px;max-width:260px' }, [
    h('a', { href: url, target: '_blank', rel: 'noopener' }, [h('img', { src: picture, alt: label, style: 'width:100%;height:230px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line);display:block' })]),
    h('div', { class: 'hint', style: 'margin:4px 0 6px;font-weight:600', textContent: label }), ...(extra ?? []),
  ]);
  return h('div', { class: 'card', style: 'margin-top:18px' }, [
    h('h2', { textContent: 'Would you like to see another version of a page?' }),
    h('p', { class: 'lead', textContent: 'We can draw a different layout and colour scheme of any page, with the same words and photos. It takes about two minutes. You then choose the version you like better, and you can switch back at any time.' }),
    ...pages.map((p) => {
      const other = p.other?.[0];
      const state = states[p.slug];
      const row = [thumb(other ? 'Your current version' : 'Your page', p.picture, p.url)];
      if (other) row.push(thumb('Another version', other.picture, other.url, [h('button', { class: 'warm', style: 'padding:9px 16px;font-size:15px', textContent: 'Use this version instead', onclick: () => use(p.slug, other.screenId) })]));
      else if (state === 'working') row.push(h('div', { class: 'hint', style: 'align-self:center;max-width:260px', textContent: 'Drawing another version of this page... about two minutes. You can keep looking around.' }));
      else row.push(h('div', { style: 'align-self:center;max-width:260px' }, [
        h('button', { style: 'padding:10px 18px;font-size:15px', textContent: state === 'failed' ? 'Try again' : 'Show me another version', disabled: taken >= (st.maxVersions ?? 4), onclick: () => ask(p.slug) }),
        state === 'failed' ? h('div', { class: 'hint', style: 'margin-top:6px', textContent: 'We could not draw another version this time. You can try again, or keep this one.' }) : null,
      ]));
      return h('div', { class: 'found' }, [h('div', { style: 'font-weight:600;margin-bottom:8px', textContent: p.title }), h('div', { style: 'display:flex;gap:14px;flex-wrap:wrap' }, row)]);
    }),
    taken >= (st.maxVersions ?? 4) ? h('div', { class: 'hint', textContent: `You asked for ${taken} other versions, which is the most we can draw for one request.` }) : null,
  ]);
}

function viewReady() {
  const st = S.status;
  const sketch1 = st.pages.length ? st.pages : [{ title: 'Home', url: st.sketches[1] }];
  const alt = st.sketches[2];
  const noteBox = h('div', { class: 'card', style: 'margin-top:20px' }, [
    h('label', { class: 'f', textContent: 'Anything you would like to change? (optional)' }),
    h('textarea', { placeholder: 'For example: make the logo bigger, or I prefer a lighter background.', value: S.note, oninput: (e) => { S.note = e.target.value; } }),
  ]);
  const photoNote = h('div', { class: 'note warm', style: 'margin-top:18px' }, [h('b', { textContent: 'Spots that say "Photo needed" ' }), 'are waiting for a photo from you. Wherever you gave us a good photo, it is already in place.']);

  // one design: love it, or ask for a different style
  if (!alt) {
    const working = st.alt === 'working';
    return [
      h('h1', { textContent: 'Your website design is ready' }),
      h('p', { class: 'lead', textContent: 'Here is your whole website, page by page, with your information and your own photos. Click the page names to look around, or open any page full size.' }),
      h('div', { class: 'sketches single' }, [designCard({ title: 'Your website design', desc: 'Planned around your brand colors and your goal, with a carefully balanced layout.', pages: sketch1 })]),
      st.longLists ? h('div', { class: 'note good', textContent: `Your list has ${st.longLists} items. To keep the drawing quick, these sketches show only a few of them in each section. Your finished website shows every item of your list, each with its own photo and its price.` }) : null,
      photoNote, wishesPanel(), combinedPanel(), versionsPanel(), noteBox,
      h('div', { class: 'row' }, [
        h('button', { class: 'go', textContent: 'I love it: this is my design', onclick: () => choose(1) }),
        working ? h('span', { class: 'hint', textContent: 'Drawing another style of your home page... about 2 minutes.' })
          : h('button', { textContent: st.alt === 'failed' ? 'Try another style again' : 'Show me a different style', onclick: askAnotherStyle }),
      ]),
      st.alt === 'failed' ? h('div', { class: 'note bad', textContent: 'We could not draw another style this time. You can try again, or keep this design.' }) : null,
    ];
  }

  // the customer asked for a different style: two to choose from
  const cards = [[1, 'Style 1: Guided design', 'Planned around your brand colors, with a carefully balanced layout. Your whole website.', sketch1], [2, 'Style 2: A fresh, free take', 'A more free, creative interpretation. Only the home page is shown: if you pick it, we draw your other pages in this style.', [{ title: 'Home page', url: alt }]]];
  const pickButtons = {}; const cardEls = {}; let confirmButton;
  const updatePick = () => {
    for (const n of [1, 2]) { cardEls[n].classList.toggle('picked', S.picked === n); pickButtons[n].className = S.picked === n ? 'go' : 'warm'; pickButtons[n].textContent = S.picked === n ? 'Chosen ✓' : 'I choose this one'; }
    confirmButton.disabled = !S.picked; confirmButton.textContent = S.picked ? `Confirm style ${S.picked}` : 'Choose a style first';
  };
  const els = cards.map(([n, title, desc, pages]) => {
    const pick = h('button', { class: S.picked === n ? 'go' : 'warm', textContent: S.picked === n ? 'Chosen ✓' : 'I choose this one' });
    pick.addEventListener('click', () => { S.picked = n; updatePick(); });
    pickButtons[n] = pick;
    return (cardEls[n] = designCard({ title, desc, pages, extra: [pick] }));
  });
  return [
    h('h1', { textContent: 'Two styles to choose from' }),
    h('p', { class: 'lead', textContent: 'Both use your information and your own photos. Look at them, open them full size, and choose the one you like more.' }),
    h('div', { class: 'sketches' }, els), photoNote, wishesPanel(), combinedPanel(), noteBox,
    h('div', { class: 'row' }, [(confirmButton = h('button', { class: 'go', textContent: S.picked ? `Confirm style ${S.picked}` : 'Choose a style first', disabled: !S.picked, onclick: () => choose(S.picked) }))]),
  ];
}

function viewBuilding() {
  return [h('div', { class: 'card center' }, [
    h('div', { class: 'dot', style: 'margin:0 auto 14px;width:44px;height:44px;border-color:var(--warm);border-top-color:transparent;animation:spin .9s linear infinite' }),
    h('h2', { textContent: 'Great choice! We are finishing your design' }),
    h('p', { class: 'lead', style: 'margin:8px auto 0', textContent: 'We are saving your choice and drawing any remaining pages in your style. This can take a few minutes. You can keep this page open.' }),
  ])];
}

function viewChosen() {
  return [h('div', { class: 'card center' }, [
    h('div', { class: 'check', textContent: '🎉' }),
    h('h2', { textContent: 'Your website design is approved' }),
    h('p', { class: 'lead', style: 'margin:8px auto 16px', textContent: S.status?.siteReady ? 'Your real website is ready to look at. Click any text or picture to change it. Nothing is lost: you can always go back to the original.' : 'Thank you! Our team will now turn your design into your real, working website and get in touch with you.' }),
    h('div', { class: 'row', style: 'justify-content:center' }, [S.status?.siteReady ? h('a', { class: 'go', href: `/site/${S.id}/?edit=1`, target: '_blank', style: 'display:inline-block;padding:12px 18px;border-radius:10px;text-decoration:none;color:#fff;background:#2f6fed', textContent: 'Look at and edit my website' }) : null, S.status?.siteReady ? h('a', { href: `/phone/${S.id}/`, target: '_blank', style: 'display:inline-block;padding:12px 18px;border-radius:10px;text-decoration:none;border:1px solid #2f6fed;color:#2f6fed', textContent: 'See it on a phone' }) : null, h('button', { textContent: 'I changed my mind', onclick: () => { S.view = 'ready'; render(); } }), h('button', { class: 'go', textContent: 'Start a new website', onclick: goHome })]),
  ])];
}

function viewFailed() {
  return [h('div', { class: 'card' }, [
    h('h2', { textContent: 'We hit a small problem' }),
    h('p', { class: 'lead', textContent: S.status?.message || 'Something went wrong. Please try again.' }),
    h('div', { class: 'row' }, [h('button', { class: 'go', textContent: 'Try again', onclick: async () => { try { await post(`/api/retry/${S.id}`); S.view = 'working'; render(); watch(); } catch (e) { alert(e.message); } } })]),
  ])];
}

// ---------- going back to the start ----------
// Starts a brand new request. The old one keeps running safely in the background (its link still works).
function goHome() {
  S.kind = null; S.formKind = null; S.addTab = null; S.socials = null; S.items = []; S.overrides = {}; S.noPhoto = {}; S.draftId = null; S.docsUploaded = {}; S.listMessage = '';
  S.id = null; S.status = null; S.view = 'form'; S.step = 0; S.form = empty(); S.files = { logo: null, photos: [], documents: [], knowledge: [] };
  S.errors = []; S.softAsked = false; S.softOk = false; S.picked = 0; S.note = ''; S.fileMessage = ''; S.answers = undefined; S.skip = undefined; S.lastAlt = undefined; S.touched = false;
  try { localStorage.removeItem('sketchRequestId'); } catch { /* storage not available */ }
  history.replaceState(null, '', location.pathname);
  render(); window.scrollTo(0, 0); loadMine();
}

// ---------- routing and polling ----------
const PHASE_VIEW = { queued: 'working', analyzing: 'working', designing: 'working', confirm: 'confirm', ready: 'ready', building: 'building', chosen: 'chosen', failed: 'failed' };
// a customer who pressed "I changed my mind" stays on the choice screen while the saved phase is still "chosen"
const phaseView = (phase, before) => (phase === 'chosen' && before === 'ready' ? 'ready' : PHASE_VIEW[phase] ?? 'form');
let watching = false;
async function watch() {
  if (watching) return;
  watching = true;
  try {
    while (S.id) {
      const st = await api(`/api/status/${S.id}`);
      const before = S.view;
      S.status = st;
      const view = phaseView(st.phase, before);
      if (st.choice && S.picked === 0) S.picked = st.choice.choice;
      const altChanged = st.alt !== S.lastAlt;
      S.lastAlt = st.alt;
      const versionsKey = JSON.stringify(st.variants ?? {}) + (st.pages ?? []).map((p) => (p.other ?? []).length).join('');
      const versionsChanged = versionsKey !== S.lastVersions;
      S.lastVersions = versionsKey;
      S.view = view;
      if (view !== before || view === 'working' || altChanged || versionsChanged) render();
      await sleep(['working', 'building'].includes(view) || st.alt === 'working' || Object.values(st.variants ?? {}).includes('working') ? 2500 : 8000);
    }
    watching = false;
  } catch { watching = false; }
}

function render() {
  const app = $('app');
  $('topright').replaceChildren(S.view === 'form' ? '' : h('button', { class: 'quiet', textContent: '← Back to the start', onclick: goHome }));
  const views = { form: viewForm, working: viewWorking, confirm: viewConfirm, ready: viewReady, building: viewBuilding, chosen: viewChosen, failed: viewFailed };
  app.replaceChildren(...(views[S.view] ?? viewForm)());
  const first = document.querySelector('input[type=text], textarea');
  if (S.view === 'form' && S.step === 0 && first && !S.touched) { S.touched = true; first.focus(); }
}

async function boot() {
  const query = new URLSearchParams(location.search);
  if (query.get('id')) S.id = query.get('id'); // a link to a request: open it directly
  if (S.id) {
    try {
      const st = await api(`/api/status/${S.id}`);
      if (st.phase && st.phase !== 'new') { S.status = st; S.view = PHASE_VIEW[st.phase] ?? 'form'; rememberId(S.id); S.lastAlt = st.alt; if (st.choice) S.picked = st.choice.choice; render(); watch(); return; }
    } catch { /* the saved request no longer exists: start fresh */ }
  }
  render(); loadMine();
}
$('brand').addEventListener('click', goHome);
$('brand').addEventListener('keydown', (e) => { if (e.key === 'Enter') goHome(); });
boot();
</script>
</body>
</html>
